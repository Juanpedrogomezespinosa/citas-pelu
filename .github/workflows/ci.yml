# Integración continua: en cada push y pull request.
#  - backend: lint, formato, tipos, tests unitarios y de integración contra MySQL real,
#    y prueba de que las migraciones se aplican y revierten.
#  - frontend: lint, formato, tipos (astro check) y build.
#  - docker: construye las imágenes de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci_root
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Migraciones reversibles (up -> down -> up)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci_root
          DB_NAME: peluqueria_ci
          JWT_SECRET: ci-secret-de-al-menos-treinta-y-dos-caracteres
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root -e "CREATE DATABASE peluqueria_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          npm run db:migrate && npm run db:rollback && npm run db:migrate
          npm run build && node dist/db/migrate.js status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build # incluye astro check

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen del panel
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
