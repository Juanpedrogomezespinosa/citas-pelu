# nginx del panel: estáticos + proxy de la API bajo el mismo origen.
# TLS: termínalo delante (Caddy, Traefik, balanceador del proveedor...) o
# añade aquí el bloque `listen 443 ssl` con tus certificados.
#
# Ojo con nginx: un `add_header` dentro de un `location` ANULA todos los
# heredados del `server`. Por eso las cabeceras se definen solo aquí arriba y
# el Cache-Control varía mediante un `map`, sin add_header en los location.

map $uri $cache_control {
  default        "no-cache";
  ~^/_astro/     "public, max-age=31536000, immutable";
  ~^/favicon     "public, max-age=86400";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # CSP estricta: sin scripts de terceros; fuentes de Google Fonts.
  # 'unsafe-inline' en script-src es necesario por los scripts en línea que
  # Astro genera para hidratar las islas y por el script de la barra lateral.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $cache_control always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: mismo origen. X-Forwarded-* para que el backend (TRUST_PROXY=true)
  # vea la IP real en el rate limiting y el protocolo correcto.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 200k;
  }

  # Las métricas no se exponen al exterior: Prometheus las lee en la red interna
  location = /api/metrics {
    return 404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
